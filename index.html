<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Круги на Соколе</title>
<meta name="theme-color" content="#0f1e46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сокол">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&family=Jost:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--f1:"Golos Text",system-ui,sans-serif;--f2:"Futura PT",Futura,Jost,"Golos Text",sans-serif;--navy:#0f1e46;--navy2:#172b62;--blue:#2f7fe8;--sky:#4fc3ff;--yel:#ffd23f;--org:#ff8a1f;--grn:#3ddc84;--red:#ff4d5e;--txt:#fff;--mut:#a9b8de;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1e46;font-family:var(--f1);color:var(--txt);overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 88% 72% at 50% 46%,transparent 56%,rgba(8,14,46,.36) 100%)}
.news{display:flex;flex-direction:column;gap:7px;margin:10px 0 14px;text-align:left}.news div{display:flex;gap:9px;align-items:flex-start;font-weight:800;font-size:13.5px;line-height:1.3}.news div span:first-child{flex:none;font-size:18px;line-height:1.1}.verTag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:9px;background:linear-gradient(180deg,#ffe45a,#ffad1f);border:2px solid var(--ol);color:#fff;text-shadow:var(--ts1);font-size:13px;transform:rotate(-4deg)}
#tap{position:absolute;inset:0;z-index:1}
.f{font-family:var(--f2);letter-spacing:.01em}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(var(--st) + 10px) 12px 0;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 5px;border-radius:20px;background:rgba(10,20,52,.78);border:2px solid rgba(255,255,255,.14);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pill b{font-family:var(--f2);font-weight:800;font-size:17px;min-width:24px;white-space:nowrap}
.ico{display:block;object-fit:contain;flex:none;pointer-events:none}
.pill .ico{width:30px;height:30px}
.pill .ico.note{width:36px;height:26px}
.sp{flex:1}
/* значок «на стадионе»: сколько людей играет прямо сейчас (счётчик — src/metrics.js) */
.pill.on{pointer-events:auto;padding:0 11px;gap:7px;color:#fff;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pill.on[hidden]{display:none}
.pill.on b{min-width:0}
.pill.on.tight{padding:0 7px}.pill.on.tight b{display:none}
@media (max-width:340px){#hud .row{gap:6px}}
.pill.on:active{transform:translateY(2px)}
.pill.on i,.ondot{flex:none;display:inline-block;width:12px;height:12px;border-radius:50%;background:#5dff6e;box-shadow:0 0 0 2px var(--ol),0 0 10px 2px #5dff6e;animation:onp 1.8s ease-in-out infinite}
.mc .big .ondot{width:18px;height:18px}
@keyframes onp{50%{box-shadow:0 0 0 2px var(--ol),0 0 0 0 #5dff6e}}
@media (prefers-reduced-motion:reduce){.pill.on i,.ondot{animation:none}}
.ibtn{pointer-events:auto;width:40px;height:40px;border-radius:13px;border:2px solid rgba(255,255,255,.18);background:rgba(10,20,52,.78);color:#fff;font-size:19px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.rank{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 8px;border-radius:14px;background:linear-gradient(135deg,rgba(47,127,232,.92),rgba(98,70,220,.92));border:2px solid rgba(255,255,255,.25);box-shadow:0 3px 0 rgba(0,0,0,.25);max-width:80%}
.rank .t{font-family:var(--f1);font-weight:800;font-size:14px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rank .s{font-size:12px;font-weight:800;color:#dfe8ff;margin-top:2px}
.lapw{display:flex;align-items:center;gap:2px;margin-top:8px;width:min(290px,78%)}.lapw .flag{width:30px;height:30px;margin-left:-6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.lap{position:relative;flex:1;height:22px;border-radius:12px;background:rgba(10,20,52,.7);border:2px solid rgba(255,255,255,.14);overflow:hidden;width:min(260px,70%)}
.lap i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--yel),var(--org));border-radius:10px;transition:width .12s linear}
.lap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f2);font-weight:800;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;padding:0 6px}
#boosts{position:absolute;right:12px;top:calc(var(--st) + 58px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bchip{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:12px;background:rgba(255,210,63,.95);color:#3a2600;font-weight:900;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#speedo{position:absolute;right:12px;z-index:5;pointer-events:none;bottom:calc(var(--sb) + 84px);text-align:right;transition:bottom .25s}
#speedo{display:flex;align-items:center;gap:4px}#speedo .ico{width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#speedo b{font-family:var(--f2);font-weight:800;font-size:34px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.35);display:block;line-height:1}
#speedo small{font-weight:900;font-size:12px;color:#dfe8ff;text-shadow:0 1px 2px #000}
#teamline{position:absolute;left:12px;z-index:5;pointer-events:none;bottom:calc(var(--sb) + 86px);font-weight:900;font-size:12px;text-shadow:0 1px 3px #000;transition:bottom .25s}
body.sheet-open #speedo,body.sheet-open #teamline{bottom:calc(52vh + 10px)}body.sheet-open #hint{opacity:0!important}
#hint{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;font-family:var(--f1);font-weight:800;font-size:20px;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:pulse 1.1s ease-in-out infinite;transition:opacity .4s}
#hint small{display:block;font-family:var(--f1);font-weight:900;font-size:13px;margin-top:6px;color:#e6eeff}
#hint .hand{position:relative;display:block;width:76px;height:76px;margin:0 auto 4px}#hint .hand .ico{position:absolute;inset:0;width:76px;height:76px}#hint .h2{animation:hblink .7s steps(1) infinite}@keyframes hblink{50%{opacity:0}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--f2);font-weight:800;font-size:22px;color:var(--yel);text-shadow:0 3px 0 rgba(0,0,0,.45);animation:fly 1.3s ease-out forwards;white-space:nowrap;display:flex;align-items:center;gap:6px}
.fl .ico{width:32px;height:32px}.fl .ico.coin{animation:cspin .5s linear infinite}@keyframes cspin{50%{transform:scaleX(.15)}}
.fl.big{font-size:30px}
.fl.note{color:#8dffb8}
@keyframes fly{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.12);opacity:1}100%{transform:translate(-50%,-110px) scale(1);opacity:0}}
.rip{position:absolute;width:70px;height:50px;margin:-25px 0 0 -35px;animation:rip .38s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.toast{position:absolute;left:50%;top:calc(var(--st) + 130px);transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#ffd23f,#ff9a1f);color:#3a2000;font-family:var(--f1);font-weight:800;font-size:15px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:toast 2.6s ease forwards;max-width:86%}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1.04)}15%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
/* Tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:8px 8px calc(var(--sb) + 8px);background:linear-gradient(180deg,rgba(15,30,70,0),rgba(15,30,70,.92) 30%)}
#tabs button{flex:1;position:relative;height:60px;border-radius:16px;border:2px solid rgba(255,255,255,.16);background:linear-gradient(180deg,#24418c,#172b62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f1);font-weight:900;font-size:11px;box-shadow:0 4px 0 #0a1636;transition:transform .06s}
#tabs button .e{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transition:transform .15s}#tabs button.on .e{transform:scale(1.18) translateY(-3px)}
#tabs button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1636}
#tabs button.on{background:linear-gradient(180deg,#ffd23f,#ff9a1f);color:#3a2000;border-color:#fff3b0;box-shadow:0 4px 0 #a85a00}
#tabs .dot{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);border:2px solid #fff;font-size:11px;display:none;align-items:center;justify-content:center;font-weight:900}
#tabs .dot.show{display:flex}
/* Sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;height:calc(52vh + var(--sb) + 76px);padding-bottom:calc(var(--sb) + 80px);background:linear-gradient(180deg,#1b3272,#0f1e46);border-radius:24px 24px 0 0;border-top:3px solid rgba(255,255,255,.2);box-shadow:0 -6px 30px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;touch-action:pan-y}
body.sheet-open #sheet{transform:none}
.sh-h{display:flex;align-items:center;padding:12px 14px 8px}
.sh-h h2{margin:0;font-family:var(--f1);font-weight:800;font-weight:400;font-size:20px;flex:1}
.sh-h button{width:36px;height:36px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:16px}
#body{flex:1;overflow-y:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.08);margin-bottom:8px}
.card .ic{width:56px;height:56px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,.04) 70%);position:relative}.card .ic .ico{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}.card .ic.wide{width:96px;height:56px}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:900;font-size:15px;line-height:1.15}
.card .tr{font-size:12px;color:var(--sky);font-weight:800;margin-top:1px}
.card .ef{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.lv i.on{background:var(--yel)}
.lv i.tier{margin-right:3px}
.buy{flex:none;min-width:92px;height:46px;padding:0 10px;border-radius:14px;border:2px solid #b9ffd6;background:linear-gradient(180deg,#4be38f,#22b866);color:#06331a;font-family:var(--f1);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 #137a42;transition:transform .06s}
.buy .ico{width:20px;height:20px}
.buy .ico.note{width:26px;height:18px}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #137a42}
.buy.no{filter:grayscale(1) brightness(.7);box-shadow:0 4px 0 #333}
.buy.max{background:rgba(255,255,255,.12);border-color:transparent;color:#cfd8f5;box-shadow:none}
.hero{padding:14px;border-radius:18px;background:linear-gradient(135deg,#2f7fe8,#6246dc);border:2px solid rgba(255,255,255,.25);margin-bottom:10px}
.hero .t{font-family:var(--f1);font-weight:800;font-size:19px;line-height:1.15}
.hero .s{font-weight:800;font-size:13px;color:#e3eaff;margin-top:4px}
.hero .lv i{height:7px;background:rgba(255,255,255,.25)}
.hero .lv i.on{background:var(--yel)}
.hero .buy{width:100%;margin-top:12px;height:52px;font-size:15px}
.team{margin-top:8px;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.18);border-radius:10px;padding:7px 9px;line-height:1.45}
.ladder{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.ladder div{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--mut)}
.ladder div.done{color:#bff5d4}
.ladder div.cur{background:rgba(255,210,63,.16);color:var(--yel);border:2px solid rgba(255,210,63,.5)}
.ladder em{font-style:normal;margin-left:auto;font-size:11px;opacity:.85}
.sec{font-family:var(--f1);font-weight:800;font-size:14px;color:var(--mut);margin:12px 2px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:var(--mut);position:relative}
.cal div .r{font-size:17px;line-height:1.1}
.cal div.got{background:rgba(61,220,132,.18);border-color:rgba(61,220,132,.5);color:#bff5d4}
.cal div.got::after{content:"✓";position:absolute;top:1px;right:4px;font-size:11px;color:var(--grn)}
.cal div.next{background:rgba(255,210,63,.2);border-color:var(--yel);color:var(--yel);animation:glow 1.2s ease-in-out infinite}
.cal div.big{background:rgba(98,70,220,.25)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,210,63,.25)}}
.offer{padding:12px;border-radius:16px;background:linear-gradient(135deg,#ff8a1f,#ff4d5e);margin-bottom:10px;border:2px solid rgba(255,255,255,.3)}
.offer .t{font-family:var(--f1);font-weight:800;font-size:15px}
.offer .s{font-weight:800;font-size:12px;opacity:.95;margin-top:2px}
.offer .card{background:rgba(0,0,0,.15);margin:8px 0 0}
.muted{color:var(--mut);font-size:12px;font-weight:700;line-height:1.4}
/* Modal */
#modal{position:absolute;inset:0;z-index:40;background:rgba(5,10,30,.62);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.mc{width:100%;max-width:380px;max-height:86vh;overflow:auto;border-radius:24px;padding:20px 18px 18px;background:linear-gradient(180deg,#24418c,#13265a);border:3px solid rgba(255,255,255,.22);box-shadow:0 10px 40px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,1.4,.4,1);text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mc h3{margin:0 0 6px;font-family:var(--f2);font-weight:800;font-weight:800;font-size:22px;line-height:1.2}
.mc p{margin:6px 0 14px;font-weight:700;color:#d6e0ff;font-size:14px;line-height:1.4}
.mc .big{font-family:var(--f2);font-weight:800;font-size:34px;color:var(--yel);display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 14px}
.mc .big .ico{width:46px;height:46px}.mc .art{width:120px;height:120px;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.mc .buy{width:100%;height:52px;font-size:16px;margin-top:8px}
.mc .ghost{width:100%;height:46px;margin-top:8px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-weight:900;font-size:14px;font-family:var(--f1)}
.gender{display:flex;gap:10px;margin:14px 0 4px}
.gender button{flex:1;padding:16px 8px;border-radius:18px;border:3px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-weight:900;font-size:15px;font-family:var(--f1)}
.gender button .e{font-size:46px;display:block;margin-bottom:6px}
.gender button.on{border-color:var(--yel);background:rgba(255,210,63,.18)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:15px;text-align:left}
.tg{width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;border:none;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--grn)}
.tg.on::after{left:25px}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.2);border-radius:12px;padding:3px}
.seg button{border:none;background:transparent;color:#cfd8f5;font-weight:900;font-size:12px;padding:6px 9px;border-radius:9px;font-family:var(--f1)}
.seg button.on{background:var(--blue);color:#fff}
.howto{text-align:left;font-size:13px;font-weight:700;color:#d6e0ff;line-height:1.5;background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px;margin-top:12px}
#loading{position:absolute;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#2f5fc8,#0f1e46 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#loading .lcoin{width:96px;height:96px;animation:cspin 1s linear infinite}
#loading .logo{font-family:var(--f2);font-weight:800;font-size:34px;text-align:center;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#loading .logo small{display:block;font-size:15px;color:var(--yel);margin-top:6px}
#loading .bar{width:180px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--yel);animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
@media (min-width:900px){#sheet{left:auto;right:16px;width:420px;bottom:96px;height:calc(100vh - 220px);padding-bottom:12px;border-radius:24px}#tabs{left:50%;right:auto;transform:translateX(-50%);width:520px;background:none}body.sheet-open #speedo,body.sheet-open #teamline{bottom:96px}body.sheet-open #speedo{right:452px}}
.rank .rb{width:46px;height:46px;margin:-6px 0 -6px -6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#teamline .ico{display:inline-block;width:34px;height:22px;vertical-align:middle;margin-right:2px}
.bchip .ico{width:20px;height:20px}
.hero{display:block}.hero .top{display:flex;gap:12px;align-items:center}.hero .top .ico{width:86px;height:86px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.roles span{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 8px 3px 3px;font-weight:900}.roles .ico{width:26px;height:26px}
.ladder .ico{width:30px;height:30px}.ladder .st{width:20px;height:20px;margin-left:6px}
.offer .head{display:flex;align-items:center;gap:8px}.offer .head .lbl{height:44px;width:auto}.offer .tm{display:flex;align-items:center;gap:4px;margin-left:auto;font-weight:900;font-size:13px}.offer .tm .ico{width:24px;height:24px}
.cal div .ri{width:30px;height:30px}.cal div.got .ri{opacity:.55}
.weekb{height:46px;width:auto;margin:0 auto 10px}
.toast .ico{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-right:4px}

/* ===== Тема в стиле Subway Surfers 2 ===== */
:root{--ol:#0b1d4f;--ts:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.4px 1.4px 0 var(--ol),-1.4px -1.4px 0 var(--ol),1.4px -1.4px 0 var(--ol),-1.4px 1.4px 0 var(--ol),0 4px 0 var(--ol);--ts1:1.5px 0 0 var(--ol),-1.5px 0 0 var(--ol),0 1.5px 0 var(--ol),0 -1.5px 0 var(--ol),0 3px 0 var(--ol)}
.pill,.ibtn{background:linear-gradient(180deg,#3d8bff,#1b54d6);border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 var(--ol);border-radius:18px}

.rank .t,.rank .s{color:#fff;text-shadow:var(--ts1)}
.rank .t{font-family:var(--f2);font-style:italic;font-size:15px}
.lap{height:24px;border:3px solid var(--ol);background:#0e2a6e;box-shadow:0 3px 0 var(--ol)}
.lap i{background:repeating-linear-gradient(-45deg,#7dff4f 0 10px,#4fe03a 10px 20px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);animation:stripes .6s linear infinite;background-size:28px 28px}
@keyframes stripes{to{background-position:28px 0}}
.lap span{text-shadow:var(--ts1);font-style:italic}
#speedo b{font-style:italic;text-shadow:var(--ts);font-size:40px}#speedo small{text-shadow:var(--ts1);color:#fff}
#teamline{text-shadow:var(--ts1);font-size:13px}
#hint{text-shadow:var(--ts);font-style:italic;font-size:24px}#hint small{text-shadow:var(--ts1);font-style:normal}
.fl{text-shadow:var(--ts);font-style:italic}
.toast{border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 5px 0 var(--ol);color:#fff;text-shadow:var(--ts1);background:linear-gradient(180deg,#ffe45a,#ff9a1f);border-radius:16px}
#tabs{gap:6px;background:linear-gradient(180deg,rgba(11,29,79,0),rgba(11,29,79,.75) 40%)}
#tabs button{border:3px solid var(--ol);background:linear-gradient(180deg,#4fb0ff,#1d6ff0);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ol);border-radius:18px;text-shadow:var(--ts1);font-size:11px;letter-spacing:.01em}
#tabs button:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--ol)}
#tabs button.on{background:linear-gradient(180deg,#ffe95a,#ffad1f);color:#fff;border-color:var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 var(--ol);transform:translateY(-4px)}
#tabs .dot{border:2px solid var(--ol);box-shadow:0 2px 0 var(--ol)}
.buy{border:3px solid var(--ol);background:linear-gradient(180deg,#a6ff63 0%,#45d83c 55%,#22b02f 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.15),0 5px 0 var(--ol);color:#fff;text-shadow:var(--ts1);border-radius:16px;font-family:var(--f2);font-style:italic;font-weight:800;font-size:15px}
.buy:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 1px 0 var(--ol)}
.buy.no{filter:none;background:linear-gradient(180deg,#c3cbe0,#8d98b4);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ol)}
.buy.max{background:linear-gradient(180deg,#ffe45a,#ffad1f);border:3px solid var(--ol);color:#fff;box-shadow:0 4px 0 var(--ol)}

#sheet{background:linear-gradient(180deg,#44a8ff,#1d6ff0 45%,#1450c8);border:4px solid var(--ol);border-bottom:none;border-radius:28px 28px 0 0;box-shadow:inset 0 4px 0 rgba(255,255,255,.35),0 -6px 30px rgba(0,0,0,.35)}
.sh-h h2{flex:none;display:inline-block;padding:6px 16px 7px;border:3px solid var(--ol);border-radius:14px;background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1);font-family:var(--f2);font-style:italic;font-size:19px;transform:rotate(-2deg);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--ol)}
.sh-h{justify-content:space-between}
.sh-h button{border:3px solid var(--ol);background:linear-gradient(180deg,#ff6b6b,#e0303f);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--ol);color:#fff;font-weight:900;text-shadow:var(--ts1);border-radius:12px}
.card{background:linear-gradient(180deg,#f4faff,#d6eaff);border:3px solid var(--ol);box-shadow:inset 0 3px 0 #fff,0 4px 0 var(--ol);border-radius:18px;color:var(--ol)}
.card .nm{color:var(--ol);font-family:var(--f2);font-style:italic;font-size:16px}
.card .tr{color:#1d6ff0}.card .ef{color:#4b5f8f}
.card .ic{background:radial-gradient(circle at 50% 40%,#fff,#bfe0ff 75%);border:2px solid rgba(11,29,79,.25)}
.lv i{background:rgba(11,29,79,.15);height:6px}.lv i.on{background:linear-gradient(180deg,#ffe45a,#ffad1f);box-shadow:0 0 0 1px var(--ol)}
.muted{color:#e6f1ff;text-shadow:0 1px 0 rgba(11,29,79,.6)}
.sec{color:#fff;text-shadow:var(--ts1);font-family:var(--f2);font-style:italic;font-size:16px}
.hero{background:linear-gradient(180deg,#9b6bff,#5a2fe0);border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 5px 0 var(--ol);border-radius:20px}
.hero .t{text-shadow:var(--ts1);font-style:italic}.hero .s{text-shadow:0 1px 0 var(--ol)}
.team{background:rgba(11,29,79,.35);border:2px solid rgba(11,29,79,.5)}
.ten .tbar{height:8px;margin-top:6px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(11,29,79,.45)}

.buy.wait{background:linear-gradient(180deg,#c9d3ec,#97a3c4);font-size:14px}.buy.wait .ico{width:20px;height:20px}
.card .cd{font-size:11px;font-weight:800;color:#c2410c;margin-top:3px}.card .cd.ok{color:#4b5f8f;opacity:.8}
.buy.rush{background:linear-gradient(180deg,#ffb36b,#ff7a2f 55%,#e2541a)}
.offer .card .cd,.offer .card .cd.ok{color:#fff;opacity:1;text-shadow:0 1px 0 var(--ol)}
.roles span{background:#fff;color:var(--ol);border:2px solid var(--ol)}
.ladder div{background:linear-gradient(180deg,#f4faff,#d6eaff);border:3px solid var(--ol);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
.ladder div.done{color:#1a8a3a}.ladder div.cur{background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1);border-color:var(--ol)}
.ladder em{color:inherit}
.offer{background:linear-gradient(180deg,#ff8a5a,#ff3b6a);border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ol)}
.offer .tm{color:#fff;text-shadow:var(--ts1)}
.cal div{background:linear-gradient(180deg,#f4faff,#d6eaff);border:3px solid var(--ol);color:var(--ol);box-shadow:0 3px 0 var(--ol)}
.cal div.big{background:linear-gradient(180deg,#e9dcff,#c9b2ff)}
.cal div.got{background:linear-gradient(180deg,#d9ffe4,#9ff0b8);color:#13703a}
.cal div.next{background:linear-gradient(180deg,#fff3a0,#ffd23f);color:var(--ol)}
#modal{background:rgba(5,15,50,.6)}
.mc{background:linear-gradient(180deg,#44a8ff,#1d6ff0 50%,#1450c8);border:4px solid var(--ol);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),0 8px 0 var(--ol),0 20px 50px rgba(0,0,0,.5);border-radius:26px}
.mc h3{display:inline-block;padding:6px 16px;border:3px solid var(--ol);border-radius:14px;background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1);font-style:italic;transform:rotate(-2deg);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--ol);margin:0 0 10px}
.mc p{color:#fff;text-shadow:0 1px 0 var(--ol)}
.mc .big{color:#fff;text-shadow:var(--ts);font-style:italic}
.mc .ghost{border:3px solid var(--ol);background:rgba(255,255,255,.15);text-shadow:var(--ts1)}
.mc .art{filter:drop-shadow(0 6px 0 rgba(11,29,79,.35))}
.gender button{border:3px solid var(--ol);background:linear-gradient(180deg,#f4faff,#d6eaff);color:var(--ol);box-shadow:0 4px 0 var(--ol)}
.gender button.on{background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1)}
.opt{color:#fff;text-shadow:0 1px 0 var(--ol)}
.howto{background:rgba(11,29,79,.35);color:#fff}
.tg{border:2px solid var(--ol)}
#loading{background:radial-gradient(circle at 50% 40%,#5ab8ff,#1d6ff0 60%,#0b1d4f)}
#loading .logo{text-shadow:var(--ts);font-style:italic}
.coinfly{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:7;pointer-events:none}
.pill.bump{animation:bump .3s ease}@keyframes bump{40%{transform:scale(1.18)}}
#auto{position:absolute;right:12px;z-index:5;pointer-events:none;bottom:calc(var(--sb) + 140px);display:flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border:3px solid var(--ol);border-radius:14px;background:linear-gradient(180deg,#a6ff63,#22b02f);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 4px 0 var(--ol);color:#fff;text-shadow:var(--ts1);font-weight:900;font-size:11px;transition:bottom .25s;animation:autop 1.2s ease-in-out infinite}
#auto[hidden]{display:none!important}#auto .ico{width:26px;height:26px}#auto b{font-family:var(--f2);font-style:italic;font-size:14px}
@keyframes autop{50%{transform:scale(1.06)}}
body.sheet-open #auto{bottom:calc(52vh + 64px)}

/* Новые улучшения: эмодзи вместо картинки; закрытые без коллектива; на подписи у директора */
.card .ic .emo{font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 rgba(11,29,79,.35))}
.toast .emo,.bchip .emo{font-size:18px;line-height:1}
.card.locked .ic{filter:grayscale(1);opacity:.6}.card.locked .nm,.card.locked .tr{opacity:.7}
.card.locked .buy.lock .ico{width:26px;height:26px}
.card.pend{background:linear-gradient(180deg,#fffbe6,#ffefb0)}
.card .appr{color:#7a4a00;font-weight:800}.card .appr b{font-variant-numeric:tabular-nums}.card .appr i{font-style:normal;color:#4b5f8f}
.lv i.pend{background:repeating-linear-gradient(-45deg,#ffd23f 0 4px,#fff3b0 4px 8px);animation:pendb 1.2s ease-in-out infinite}
@keyframes pendb{50%{opacity:.45}}
.bchip.appr{background:#fff;color:var(--ol);border:2px solid var(--ol)}
@media (prefers-reduced-motion:reduce){.lv i.pend{animation:none}}
/* Промокод */
.opt.promo{display:block;text-align:left}.opt.promo label{display:block;margin-bottom:8px}
.prow{display:flex;gap:6px}
.prow input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:3px solid var(--ol);background:#fff;color:var(--ol);font-family:var(--f1);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.prow input::placeholder{color:#8d98b4;text-transform:none}
.pbtn{flex:none;height:44px;padding:0 12px;border-radius:12px;border:3px solid var(--ol);background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1);font-family:var(--f2);font-style:italic;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ol)}
.pbtn:active{transform:translateY(3px);box-shadow:none}
.phelp{display:block;margin-top:6px;font-size:12px;font-weight:700;color:#e6f1ff}
.pmsg{min-height:0;font-size:13px;font-weight:800;margin-top:4px}.pmsg.err{color:#ffd9de;text-shadow:0 1px 0 var(--ol)}
/* «Плейлист директора»: два цветных прожектора качаются над стадионом + мягкая вспышка на долю */
#party{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;opacity:0;--a:#ff3fd8;--b:#3fe0ff}
#party[hidden]{display:none}
#party::before,#party::after{content:"";position:absolute;top:-6%;width:62%;height:120%;mix-blend-mode:screen;transform-origin:50% 0;opacity:.75;
  background:linear-gradient(180deg,var(--a) 0%,color-mix(in srgb,var(--a) 45%,transparent) 45%,transparent 92%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
#party::before{left:-12%;animation:beamL 2.8s ease-in-out infinite alternate}
#party::after{right:-12%;--a:var(--b);animation:beamR 3.3s ease-in-out infinite alternate}
@keyframes beamL{from{transform:rotate(-30deg)}to{transform:rotate(14deg)}}
@keyframes beamR{from{transform:rotate(30deg)}to{transform:rotate(-14deg)}}
#party .fl{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;background:radial-gradient(80% 60% at 50% 55%,color-mix(in srgb,var(--a) 70%,transparent),transparent 75%)}
#party[data-c="1"]{--a:#3fe0ff;--b:#ffe03f}#party[data-c="2"]{--a:#ffe03f;--b:#8a5cff}#party[data-c="3"]{--a:#8a5cff;--b:#ff3fd8}
@media (prefers-reduced-motion:reduce){#party::before,#party::after{animation:none}}
/* Падение */
#fallUI{position:absolute;left:50%;top:40%;z-index:5;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#fff;font-family:var(--f2);font-style:italic;text-shadow:var(--ts)}
#fallUI[hidden]{display:none}
#fallUI.in{animation:fallin .35s cubic-bezier(.2,1.6,.4,1)}@keyframes fallin{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}
#fallUI b{display:block;font-size:30px;font-weight:800}
#fallUI span{display:block;font-family:var(--f1);font-style:normal;font-weight:900;font-size:16px;margin-top:2px;text-shadow:var(--ts1)}
#fallUI .fbar{width:180px;height:16px;margin:10px auto 0;border:3px solid var(--ol);border-radius:10px;background:#0e2a6e;box-shadow:0 3px 0 var(--ol);overflow:hidden}
#fallUI .fbar i{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe45a,#ff9a1f);transition:width .1s}
@media (prefers-reduced-motion:reduce){#fallUI.in{animation:none}}

/* ===== Правки по ревью ===== */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--ol)}
.ibtn{width:44px;height:44px}.sh-h button{width:44px;height:44px}
#boosts{pointer-events:none;z-index:5}
.bchip{border:2px solid var(--ol);box-shadow:0 3px 0 var(--ol)}.bchip.warm{background:linear-gradient(180deg,#a6ff63,#22b02f);color:#fff;text-shadow:var(--ts1)}
#hud{padding-left:calc(env(safe-area-inset-left,0px) + 12px);padding-right:calc(env(safe-area-inset-right,0px) + 12px)}
/* вкладки на узких экранах */
#tabs button{min-width:0;padding:0 2px;font-size:clamp(9px,2.9vw,11px)}
@media (max-width:360px){#tabs{gap:4px;padding-inline:6px}#tabs button{height:56px}#tabs button .e{width:30px;height:30px}.pill{padding-right:9px;gap:4px}.pill b{font-size:15px!important}.pill .ico{width:26px;height:26px}.pill .ico.note{width:30px;height:22px}}
/* плашка должности и приз у финиша */
.rank{max-width:min(78%,300px);padding:5px 12px 6px 8px}
.rank .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.lapw{width:min(330px,88%)}
.lapw .prize{display:flex;align-items:center;gap:2px;margin-left:2px;font:italic 800 15px var(--f2);text-shadow:var(--ts1);white-space:nowrap}
.lapw .prize .ico{width:22px;height:22px}
.lapw.flash .lap{animation:lapflash .35s ease}.lapw.flash .flag{animation:flagw .5s ease}.lapw.flash .prize{animation:bump .35s ease}
@keyframes lapflash{40%{transform:scale(1.06);filter:brightness(1.8)}}
@keyframes flagw{25%{transform:rotate(-18deg)}60%{transform:rotate(14deg)}}
.fl.small{font-size:15px}.fl.small .ico{width:20px;height:20px}
/* подсказка у ног, автобег прячется под панелью */
#hint{top:calc(var(--st) + 26%);bottom:auto;font-size:22px}
#hint small{text-shadow:0 2px 0 var(--ol);font-weight:800}
@media (max-height:640px){#hint small{display:none}#hint{top:calc(var(--st) + 30%)}}
body.sheet-open #auto{opacity:0;transform:scale(.8)}
#auto{transition:bottom .25s,opacity .2s,transform .2s}
#speedo.idle{opacity:.55}
/* календарь */
.cal{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal div{min-width:0;border-radius:10px;font-size:10px;padding:2px 0}
.cal div .ri{width:min(30px,72%);height:auto}
.cal div .dn{font-size:9px;color:#4a5d86}
.cal div.final{grid-column:span 2;aspect-ratio:auto;background:linear-gradient(180deg,#ffe45a,#ffad1f);color:#fff;text-shadow:var(--ts1)}
.cal div.final .ri{width:44px}.cal div.final .dn{color:#fff}
/* карточки */
.card .ic.wide{width:76px;height:50px}
.card .tr small{display:block;font-size:11px;color:#4b5f8f;font-weight:700}
.card .tr{color:#1456c8}
.lv{gap:2px}.lv i{height:7px;border-radius:2px}.lv i.on{background:#ffc21f;box-shadow:inset 0 -2px 0 #e08a00}.lv i.tier{margin-right:6px}
.buy.no{background:linear-gradient(90deg,#8ce06a 0,#5cc24a var(--p,0%),#c3cbe0 var(--p,0%),#8d98b4 100%)}
.buy[disabled]{cursor:default}
.buy.danger{background:linear-gradient(180deg,#ff8b8b,#e0303f)}
@media (max-width:360px){.card{flex-wrap:wrap}.card .mid{flex:1 1 140px}.card .buy{margin-left:auto}}
/* контраст */
.muted{color:#fff;text-shadow:var(--ts1)}
.mc p{text-shadow:var(--ts1)}.mc p.small{font-size:12px;margin-top:-8px}
.hero .s{text-shadow:var(--ts1)}
.ladder div.done{color:#146c2e}
.offer .card .ef{color:#4b2030}
/* настройки */
.opt.col{flex-direction:column;align-items:stretch;gap:8px}
.seg button{min-height:40px;padding:0 12px;flex:1}
.tg{flex:none;width:52px;height:32px}.tg::after{top:4px;left:4px}.tg.on::after{left:24px}
#mG{min-height:44px;color:#fff;font-weight:900;padding:0 14px;border:none}
.mc .ghost{height:48px}
/* десктоп */
@media (min-width:900px){
  #sheet{transform:translateX(calc(100% + 40px));transition:transform .3s cubic-bezier(.2,1.2,.3,1),visibility 0s .3s;border-bottom:4px solid var(--ol);border-radius:28px}
  body.sheet-open #sheet{transform:none}
  #hud{zoom:1.3}#tabs{zoom:1.15}#speedo,#teamline,#auto{zoom:1.25}
}
#sheet{visibility:hidden;transition:transform .26s cubic-bezier(.2,.9,.3,1),visibility 0s .26s}
body.sheet-open #sheet{visibility:visible;transition-delay:0s}
/* обучение */
#guide{position:absolute;z-index:30;width:64px;height:64px;margin:-6px 0 0 -14px;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(11,29,79,.4));animation:gbob .8s ease-in-out infinite}
#guide[hidden]{display:none}
@keyframes gbob{50%{transform:translate(4px,8px) scale(.92)}}
.guide-t{animation:gring 1s ease-in-out infinite}
@keyframes gring{50%{box-shadow:0 0 0 6px #fff,0 0 0 10px #ffd23f,0 5px 0 var(--ol)}}
body.guiding #tabs button:not(.guide-t){opacity:.6}
/* печать */
.stamp{position:absolute;left:50%;top:40%;z-index:8;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:7px double #2b5fd9;color:#2b5fd9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f2);background:rgba(255,255,255,.55);transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.5,.5,1),stampout .4s ease 1.1s forwards;box-shadow:0 0 0 3px rgba(43,95,217,.35)}
.stamp b{font-size:28px;font-style:italic;letter-spacing:.04em}.stamp small{font-size:15px;font-weight:800}
@keyframes stamp{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
@keyframes stampout{to{opacity:0;transform:scale(1.1) rotate(-8deg)}}
#app.shake{animation:shake .14s linear}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,1px)}}
/* рывок и линии скорости */
#speedlines{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.55) 0deg 1.2deg,transparent 1.2deg 9deg);-webkit-mask:radial-gradient(ellipse at 50% 55%,transparent 38%,#000 75%);mask:radial-gradient(ellipse at 50% 55%,transparent 38%,#000 75%)}
#fever{position:absolute;right:14px;z-index:6;bottom:calc(var(--sb) + 196px);padding:4px 12px;border:3px solid var(--ol);border-radius:12px;background:linear-gradient(180deg,#ff8a5a,#ff2f4f);color:#fff;font:italic 800 18px var(--f2);text-shadow:var(--ts1);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--ol);transform:rotate(-4deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
body.fever #fever{transform:rotate(-4deg) scale(1)}
body.fever #speedo b{color:#ffd23f}
body.sheet-open #fever{display:none}
/* повышение */
.mc.promo{position:relative;overflow:hidden;background:linear-gradient(180deg,#5a2fe0,#2a1580);isolation:isolate}
.mc .rays{position:absolute;inset:-50%;z-index:-1;background:repeating-conic-gradient(rgba(255,255,255,.12) 0 10deg,transparent 10deg 20deg);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mc .confetti{position:absolute;inset:0;z-index:-1;pointer-events:none}
.mc .confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.2}}
.mc .badges{position:relative;height:130px}
.mc .badges .old{position:absolute;left:50%;top:10px;width:110px;height:110px;margin-left:-55px;animation:oldout .5s ease forwards}
.mc .badges .new{position:absolute;left:50%;top:0;margin-left:-60px;animation:newin .6s cubic-bezier(.3,1.6,.5,1) .35s both}
@keyframes oldout{to{transform:scale(0) rotate(-30deg);opacity:0}}
@keyframes newin{from{transform:scale(0) rotate(20deg)}}
.mc .was{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.mc .was div{display:flex;align-items:center;gap:8px;justify-content:center;background:rgba(0,0,0,.25);border:2px solid var(--ol);border-radius:12px;padding:6px 10px;font-weight:800;text-shadow:var(--ts1)}
.mc .was span{margin-right:auto;font-size:13px}.mc .was b{font:italic 800 17px var(--f2);display:flex;align-items:center;gap:4px}.mc .was b.g{color:#a6ff63}.mc .was .ico{width:24px;height:18px}
.mc .stampin{position:absolute;right:14px;top:120px;padding:4px 10px;border:4px double #ff3b4e;color:#ff3b4e;font:italic 800 20px var(--f2);transform:rotate(-12deg);background:rgba(255,255,255,.75);animation:stamp .45s cubic-bezier(.3,1.5,.5,1) .9s both;border-radius:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #hint .h2{display:none}
}

/* ===== Спринт-отрезки ===== */
#sprint{position:absolute;left:50%;top:calc(var(--st) + 200px);transform:translateX(-50%);z-index:6;width:min(310px,90%);padding:7px 10px 6px;border-radius:16px;background:linear-gradient(180deg,#3d8bff,#1b54d6);border:3px solid var(--ol);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--ol);color:#fff;pointer-events:none;font-family:var(--f2);transition:background .2s}
#sprint[hidden]{display:none}
#sprint.go{background:linear-gradient(180deg,#ff7a3d,#e0303f)}
#sprint.in{animation:spin .35s cubic-bezier(.3,1.6,.5,1)}@keyframes spin{from{transform:translateX(-50%) scale(.6);opacity:0}}
.sp-head{display:flex;align-items:center;gap:7px;font-style:italic;font-weight:800;text-shadow:var(--ts1)}
.sp-badge{padding:1px 8px;border-radius:9px;background:var(--yel);color:#3a2000;border:2px solid var(--ol);font-size:13px;text-shadow:none;letter-spacing:.03em}
.sp-n{font-size:15px}.sp-info{margin-left:auto;font-size:15px;white-space:nowrap}
.sp-gauge{position:relative;height:14px;margin-top:6px;border-radius:8px;background:#0e2a6e;border:2px solid var(--ol);overflow:hidden}
.sp-gauge .z{position:absolute;top:0;bottom:0}
.z1{left:calc(var(--b) * 100%);width:calc((var(--s) - var(--b)) * 100%);background:#d9904f}
.z2{left:calc(var(--s) * 100%);width:calc((var(--g) - var(--s)) * 100%);background:#d7dfe9}
.z3{left:calc(var(--g) * 100%);right:0;background:var(--yel)}
#spMk{position:absolute;top:-1px;bottom:-1px;left:0;width:8px;margin-left:-4px;background:#fff;border:2px solid var(--ol);border-radius:4px}
.sp-legend{display:flex;justify-content:space-between;gap:4px;margin-top:3px;font:700 11px var(--f1);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sp-legend b{font-weight:800}.sp-legend .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1.5px solid var(--ol);vertical-align:-1px}
.d1{background:#d9904f}.d2{background:#d7dfe9}.d3{background:var(--yel)}
.medal{position:absolute;left:50%;top:calc(var(--st) + 278px);z-index:8;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:18px;background:linear-gradient(180deg,#2a3d8f,#16205a);border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol);color:#fff;font-family:var(--f2);transform:translateX(-50%);animation:medalin .45s cubic-bezier(.3,1.6,.5,1),medalout .35s ease 1.6s forwards;white-space:nowrap}
.medal.rm{animation:none}
.medal .disc{width:54px;height:54px;border-radius:50%;border:3px solid var(--ol);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;text-shadow:var(--ts1);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.5)}
.medal.m3 .disc{background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 45%,#e09a12)}
.medal.m2 .disc{background:radial-gradient(circle at 35% 30%,#ffffff,#d7dfe9 45%,#97a3b5)}
.medal.m1 .disc{background:radial-gradient(circle at 35% 30%,#ffd9b0,#d9904f 45%,#9a5a28)}
.medal.m0 .disc{background:radial-gradient(circle at 35% 30%,#c9d2e3,#7d8aa6 50%,#4f5b76)}
.medal .mt{display:flex;flex-direction:column;line-height:1.1}
.medal .mt b{font-size:22px;font-style:italic;text-shadow:var(--ts1)}.medal.m3 .mt b{color:var(--yel)}
.medal .mt span{font:700 14px var(--f1)}.medal .mm{display:flex;align-items:center;gap:4px;color:var(--yel);font:italic 800 17px var(--f2)!important;text-shadow:var(--ts1)}.medal .mm .ico{width:20px;height:20px}
@keyframes medalin{from{transform:translateX(-50%) scale(.3);opacity:0}}
@keyframes medalout{to{transform:translateX(-50%) translateY(-24px) scale(.9);opacity:0}}
@media (max-height:640px){#sprint{top:calc(var(--st) + 192px)}.medal{top:calc(var(--st) + 262px)}}

/* ===== Правки по свежей проверке ===== */
#boosts{top:calc(var(--st) + 162px);right:12px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:72%}
@media (min-width:900px){#boosts{top:calc(var(--st) + 200px)}body.sheet-open #boosts{right:476px}body.sheet-open #speedo{right:476px}body.sheet-open #auto{opacity:0}}
#hint{top:calc(var(--st) + 200px)}
@media (max-height:640px){#hint{top:calc(var(--st) + 190px);font-size:18px}#hint .hand,#hint .hand .ico{width:52px;height:52px}}
.seg button{min-height:44px}.seg button.on{background:#1f63c8}
.tg{position:relative}.tg::before{content:"";position:absolute;inset:-8px -4px}
#mG{display:flex;align-items:center;justify-content:center}
#guide{margin:-46px 0 0 -10px}
.tg{width:60px;height:44px;border-radius:22px}.tg::after{top:4px;left:4px;width:30px;height:30px}.tg.on::after{left:24px}.tg::before{display:none}
#giftBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(var(--st) + 62px);width:52px;height:52px;padding:0;background:linear-gradient(180deg,#ffe45a,#ffad1f)}
#giftBtn .ico{width:38px;height:38px;margin:auto}
#giftBtn .gdot{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 2px 0 var(--ol);display:none}
#giftBtn.ready .gdot{display:block}#giftBtn.ready{animation:gwob 1.6s ease-in-out infinite}
@keyframes gwob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-12deg) scale(1.08)}82%{transform:rotate(10deg) scale(1.08)}88%{transform:rotate(-6deg)}94%{transform:rotate(4deg)}}
@media (min-width:900px){#tabs{width:440px}}
</style>
</head>

  </div>
  <div id="fallUI" hidden aria-hidden="true"><b>Упс, упали!</b><span>Тапайте, чтобы встать</span><div class="fbar"><i id="fallI"></i></div></div>
